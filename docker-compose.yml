version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: medibook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medibook
      POSTGRES_PASSWORD: medibook
      POSTGRES_DB: medibook
    ports:
      - "5432:5432"
    volumes:
      - medibook_pgdata:/var/lib/postgresql/data
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibook"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: medibook-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://medibook:medibook@db:5432/medibook
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: medibook-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  medibook_pgdata:
